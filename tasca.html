<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasca — Exercicis propis</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css?v=7">
</head>
<body>

<header>
  <div class="hd-left">
    <h1 id="hd-title">Tasca</h1>
  </div>
  <a class="site-link" href="https://step-quiz.net" target="_blank" rel="noopener" title="Step Quiz — David Arso Civil">
    <div class="site-label">Step Quiz<br>step-quiz.net</div>
    <img class="site-icon" src="assets/icon.png" alt="Step Quiz" onerror="this.style.display='none'">
  </a>
</header>

<!-- VIEW: Llista d'exercicis de la tasca -->
<div class="view active" id="v-list">
  <a class="back-btn" id="back-list" href="index.html">← Torna a les tasques</a>
  <div class="cat-title" id="tasca-title"></div>
  <div class="cat-sub" id="tasca-sub"></div>
  <ul class="ex-list" id="ex-list"></ul>
  <div class="buit" id="ex-buit" style="display:none">
    Aquesta tasca encara no està disponible.<br>Torna-hi d'aquí a uns dies.
  </div>
</div>

<!-- VIEW: Detall d'un exercici -->
<div class="view" id="v-detail">
  <button class="back-btn" onclick="goBack()">← Torna a la llista</button>
  <div class="det-header">
    <h2 id="det-title"></h2>
    <div class="det-meta" id="det-meta"></div>
  </div>
  <button class="done-btn not-done" id="done-btn" onclick="toggleDone()">Marcar com a fet</button>
  <div id="err-wrap"></div>
  <div class="page-wrap" id="page-wrap"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lb-fig" id="lb-fig" onclick="event.stopPropagation()">
    <img id="lightbox-img" src="" alt="" onclick="toggleZoom()">
    <div id="lb-pegats"></div>
    <div id="lb-marques"></div>
  </div>
  <div class="lb-peu" id="lb-peu" hidden onclick="event.stopPropagation()">
    <button type="button" class="lb-tanca" onclick="closeLightbox()" aria-label="Tanca la imatge ampliada">×</button>
    <div class="lb-peu-cos" id="lb-peu-cos"></div>
  </div>
</div>

         src="https://licensebuttons.net/l/by-nc-nd/4.0/88x31.png" onerror="this.style.display='none'">

    Prohibida la comercialització i la modificació

  </span>
</footer>

<script src="cataleg.js"></script>
<script src="hints.js"></script>
<script src="assets/katex/katex.min.js"></script>
<script src="errades.js?v=3"></script>
<script src="tasques.js"></script>
<script src="progres.js"></script>
<script>
/* ── VISOR DE TASQUES ─────────────────────────────────────────────────
   Pàgina genèrica. L'adreça mana:  tasca.html#u7/s3  obre la setmana 3
   de la unitat 7. Afegir una setmana NO vol dir crear cap fitxer nou:
   n'hi ha prou amb una línia a tasques.js. */

let TASCA = null;      // la tasca que s'està mirant
let ACTUAL = null;     // {u, n} de l'exercici obert
let Y_LLISTA = 0;      // fins on s'havia baixat a la llista en obrir un exercici

/* Les errades del solucionari viuen a errades.js. Si aquell fitxer no
   s'ha pogut carregar, la tasca es veu igualment, sense avisos. */
const AMB_ERRADES = typeof htmlErrades === 'function';
const AMB_MARQUES = AMB_ERRADES && typeof htmlMarques === 'function';   // les marques sobre la imatge (fase 2)
const AMB_PEGATS  = AMB_ERRADES && typeof htmlPegats === 'function';    // els trossos ja corregits (fase 3)

function render(){
  const id = location.hash.replace('#','');
  TASCA = tascaPerId(id);

  if(!TASCA){
    document.getElementById('tasca-title').textContent = 'Tasca no disponible';
    document.getElementById('tasca-sub').textContent = '';
    document.getElementById('ex-list').innerHTML = '';
    document.getElementById('ex-buit').style.display = 'block';
    return;
  }

  const meta = UNITATS_META[TASCA.unitat] || {nom:TASCA.unitat, subtitol:''};
  document.getElementById('back-list').href = 'index.html#' + TASCA.unitat;
  document.getElementById('hd-title').textContent = meta.nom + '. Setmana ' + TASCA.setmana;
  document.getElementById('tasca-title').textContent = TASCA.titol || ('Setmana ' + TASCA.setmana);

  const dies = diesRestants(TASCA);
  const quan = tascaVencuda(TASCA)
      ? 'data límit passada'
      : (dies === 0 ? 'venç avui' : dies === 1 ? 'venç demà' : 'falten ' + dies + ' dies');
  document.getElementById('tasca-sub').textContent =
      meta.nom + ' · ' + meta.subtitol + ' · data límit: ' + dataLlarga(TASCA.limit) + ' (' + quan + ')';

  /* Si la tasca té alguna errada, es van demanant les lletres de les fórmules. */
  if(AMB_ERRADES && refsDe(TASCA).some(r => erradesDe(r.u, r.n).length)) preparaFormules();

  /* Només a la vista prèvia del professor (?tot=1): avisa si errades.js no
     s'ha pogut carregar, perquè als alumnes no els sortiria cap errada. */
  if(!AMB_ERRADES && _preview()){
    document.getElementById('tasca-sub').textContent +=
        ' · Atenció: errades.js no s’ha pogut carregar i els alumnes no veuen cap errada. Revisa’n l’últim canvi.';
  }

  renderList();
}

function renderList(){
  const ul = document.getElementById('ex-list');
  ul.innerHTML = '';
  document.getElementById('ex-buit').style.display = 'none';

  refsDe(TASCA).forEach(r => {
    const f = fitxaDe(r.u, r.n);
    const li = document.createElement('li');

    if(!f){
      li.className = 'ex-item';
      li.innerHTML = `
        <span class="ex-badge">Ex. ${r.n}</span>
        <div class="ex-info">
          <div class="ex-title">Aquest exercici no és al catàleg de ${r.u}</div>
          <div class="ex-sub">Revisa tasques.js</div>
        </div>`;
      ul.appendChild(li);
      return;
    }

    const fet = esFet(r.u, r.n);
    const altra = r.u !== TASCA.unitat;
    const p = pistaDe(r.u, r.n);
    const avis = AMB_ERRADES ? htmlAvisErrades(r.u, r.n) : '';
    const errEnunciat = AMB_ERRADES ? htmlErradesEnunciat(r.u, r.n) : '';
    li.className = 'ex-item' + (fet ? ' is-fet' : '');
    li.innerHTML = `
      <div class="ex-row">
        <span class="ex-badge">${etiquetaDe(r.u, r.n)}</span>
        <div class="ex-info">
          <div class="ex-title">${f.t}</div>
          <div class="ex-sub">${[altra ? (UNITATS_META[r.u]||{}).nom : '', f.d].filter(Boolean).join(' · ')}</div>
        </div>
        ${fet ? '<span class="ex-fet-tag">✓ Fet</span>' : ''}
        <span class="ex-arrow">→</span>
      </div>
      <div class="pista-wrap">
        ${errEnunciat}
        <div class="ex-botons">
          ${p ? '<button class="pista-btn" type="button">💡 Veure pista</button>' : ''}
          <button class="sol-btn" type="button">📄 Veure solució</button>
          ${avis}
        </div>
        ${p ? `<div class="pista-text" style="display:none">${p}</div>` : ''}
      </div>`;
    li.querySelector('.ex-row').onclick = () => showExercise(r);
    li.querySelector('.sol-btn').onclick = (ev) => { ev.stopPropagation(); showExercise(r); };
    if(p){
      const btn = li.querySelector('.pista-btn');
      btn.onclick = (ev) => { ev.stopPropagation(); togglePista(btn); };
    }
    ul.appendChild(li);
  });
}

function showExercise(r){
  const f = fitxaDe(r.u, r.n);
  if(!f) return;
  ACTUAL = r;
  Y_LLISTA = window.scrollY;
  show('v-detail');

  const esAct = !!f.a;
  document.getElementById('det-title').textContent =
      (esAct ? 'Activitat ' : 'Exercici ') + r.n;
  document.getElementById('det-meta').textContent = f.t + (f.d ? '  ·  ' + f.d : '');
  document.getElementById('err-wrap').innerHTML = AMB_ERRADES ? htmlErrades(r.u, r.n) : '';

  const wrap = document.getElementById('page-wrap');
  wrap.innerHTML = f.i.map((p, i) => {
    const src = r.u + '/' + p;
    const quina = f.i.length > 1 ? 'Imatge ' + (i+1) + ' de ' + f.i.length : 'Enunciat i solució';
    /* Els pegats: trossos de la pàgina ja corregits, a sobre de la imatge. Si
       n'hi ha, no s'ofereix obrir la imatge sola, que sortiria sense corregir. */
    const pegats = AMB_PEGATS ? htmlPegats(r.u, p) : '';
    return `
      <div class="page-fig">
        <img src="${src}" alt="Enunciat i solució de l'${esAct ? 'activitat' : 'exercici'} ${r.n}"
             onclick="openLightbox('${src}')">
        ${pegats}
        ${AMB_MARQUES ? htmlMarques(r.u, r.n, p) : ''}
      </div>
      <div class="page-actions">
        <span class="page-fname">${quina}</span>
        ${pegats ? '' : `<a class="page-link" href="${src}" target="_blank">Obre la imatge en nova pestanya ↗</a>`}
      </div>`;
  }).join('');

  updateDoneBtn();

  /* Sempre es comença per dalt: el títol i, si n'hi ha, les errades del
     solucionari, que van just abans de la imatge. */
  window.scrollTo(0, 0);
}

function togglePista(btn){
  const text = btn.closest('.pista-wrap').querySelector('.pista-text');
  const obert = text.style.display !== 'none';
  text.style.display = obert ? 'none' : 'block';
  btn.textContent = obert ? '💡 Veure pista' : '💡 Amaga la pista';
}

/* Obre la imatge ampliada. Si es passa `k`, s'obre ja a mida real i centrada
   en l'errada número k+1, amb la correcció a sota. */
function openLightbox(src, k){
  const lb = document.getElementById('lightbox');
  lb.classList.remove('zoomed');
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lb-pegats').innerHTML =
      (AMB_PEGATS && ACTUAL) ? htmlPegats(ACTUAL.u, src.slice(ACTUAL.u.length + 1)) : '';
  document.getElementById('lb-marques').innerHTML =
      (AMB_MARQUES && ACTUAL) ? htmlMarques(ACTUAL.u, ACTUAL.n, src.slice(ACTUAL.u.length + 1)) : '';
  treuPeu();
  lb.classList.add('active');
  if(k !== undefined && k !== null) seleccionaErrada(k);
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active', 'zoomed');
  treuPeu();
}

function treuPeu(){
  document.getElementById('lb-peu').hidden = true;
  document.getElementById('lb-fig').style.marginBottom = '';
  document.getElementById('lightbox-img').style.width = '';
  document.querySelectorAll('#lb-marques .marca.activa').forEach(m => m.classList.remove('activa'));
}

// Toca la imatge del lightbox per ampliar-la a mida real (amb scroll);
// toca el fons per tancar. Cada imatge nova s'obre sense zoom.
function toggleZoom(){
  treuPeu();
  document.getElementById('lightbox').classList.toggle('zoomed');
}

/* Dins de la imatge ampliada: destaca l'errada k, n'ensenya la correcció al
   peu i mou la imatge perquè el requadre quedi al mig de la pantalla. */
function seleccionaErrada(k){
  if(!ACTUAL) return;
  const lb = document.getElementById('lightbox');
  const peu = document.getElementById('lb-peu');
  const fig = document.getElementById('lb-fig');
  const img = document.getElementById('lightbox-img');
  lb.classList.add('zoomed');
  lb.querySelectorAll('.marca').forEach(m => m.classList.toggle('activa', m.dataset.k === String(k)));
  document.getElementById('lb-peu-cos').innerHTML = htmlErradaSola(ACTUAL.u, ACTUAL.n, k);
  peu.hidden = false;
  const centra = () => {
    const m = lb.querySelector('.marca[data-k="' + k + '"]');
    if(!m) return;
    /* A mida real, o una mica menys si cal perquè el requadre es vegi sencer
       (al mòbil, una línia llarga a mida real no hi cap). Mai més petita que
       la pantalla. */
    const ample = img.naturalWidth, alt = img.naturalHeight;
    const fw = parseFloat(m.style.width) / 100, fh = parseFloat(m.style.height) / 100;
    const lliureX = lb.clientWidth - 28, lliureY = lb.clientHeight - peu.offsetHeight - 28;
    let escala = Math.min(1, lliureX / (fw * ample), lliureY / (fh * alt));
    escala = Math.max(escala, Math.min(1, lb.clientWidth / ample));
    img.style.width = Math.round(ample * escala) + 'px';
    fig.style.marginBottom = peu.offsetHeight + 'px';   // el final de la imatge es pot pujar per sobre del peu
    lb.scrollLeft = fig.offsetLeft + m.offsetLeft + m.offsetWidth/2 - lb.clientWidth/2;
    lb.scrollTop  = fig.offsetTop + m.offsetTop + m.offsetHeight/2 - (lb.clientHeight - peu.offsetHeight)/2;
  };
  if(img.complete && img.naturalWidth) centra();
  else img.addEventListener('load', centra, {once:true});
}

/* Obre la imatge on hi ha l'errada k (la primera, o la que es digui a `src`),
   ampliada i centrada en el requadre. */
function obreErrada(k, src){
  if(!ACTUAL || !AMB_MARQUES) return;
  const q = marquesDe(erradesDe(ACTUAL.u, ACTUAL.n)[k]);
  if(q.length) openLightbox(src || (ACTUAL.u + '/' + q[0].img), k);
}

function goBack(){
  ACTUAL = null;
  show('v-list');
  renderList();
  window.scrollTo(0, Y_LLISTA);     // la llista, allà on s'havia deixat
}

function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateDoneBtn(){
  if(!ACTUAL) return;
  const fet = esFet(ACTUAL.u, ACTUAL.n);
  const btn = document.getElementById('done-btn');
  btn.className = 'done-btn ' + (fet ? 'is-done' : 'not-done');
  btn.textContent = fet ? '✓ Fet' : 'Marcar com a fet';
}

function toggleDone(){
  if(!ACTUAL) return;
  marcaFet(ACTUAL.u, ACTUAL.n, !esFet(ACTUAL.u, ACTUAL.n));
  updateDoneBtn();
}

/* Un requadre de la imatge, o «Mostra-ho a la imatge» d'una targeta: s'obre
   la imatge ampliada en aquell punt. Dins de la imatge ampliada, tocar un
   altre requadre canvia d'errada. */
document.getElementById('page-wrap').addEventListener('click', ev => {
  const m = ev.target.closest('.marca');
  if(m) obreErrada(Number(m.dataset.k), m.closest('.page-fig').querySelector('img').getAttribute('src'));
});
document.getElementById('err-wrap').addEventListener('click', ev => {
  const b = ev.target.closest('.err-veure');
  if(b) obreErrada(Number(b.dataset.k));
});
document.getElementById('lb-marques').addEventListener('click', ev => {
  const m = ev.target.closest('.marca');
  if(m) seleccionaErrada(Number(m.dataset.k));
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeLightbox(); });

/* Eina del professor per marcar on és una errada: tasca.html?tot=1&marca=1 */
if(location.search.indexOf('marca=1') >= 0){
  const eina = document.createElement('script');
  eina.src = 'marca.js';
  document.body.appendChild(eina);
}

window.addEventListener('hashchange', () => { show('v-list'); render(); });
render();
</script>
</body>
