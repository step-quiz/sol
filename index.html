<!DOCTYPE html>

<title>Exercicis propis — Step Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

<body>

<header>
  <div class="hd-left">
    <h1 id="hd-title">Exercicis propis</h1>
  </div>
  <a class="site-link" href="https://step-quiz.net" target="_blank" rel="noopener" title="Step Quiz — David Arso Civil">
    <div class="site-label">Step Quiz<br>step-quiz.net</div>
    <img class="site-icon" src="assets/icon.png" alt="Step Quiz" onerror="this.style.display='none'">
  </a>
</header>

<!-- VIEW: Unitats -->
<div class="view active" id="v-unitats">
  <div class="cat-title">Unitats didàctiques</div>
  <div class="cat-sub">Tria una unitat per veure els seus temes</div>
  <ul class="ex-list" id="unitats-list"></ul>
  <div class="buit" id="unitats-buit" style="display:none">
    Encara no hi ha cap unitat publicada.<br>Torna-hi d'aquí a uns dies.
  </div>
</div>

<!-- VIEW: Temes (dins d'una unitat) -->
<div class="view" id="v-temes">
  <button class="back-btn" onclick="goBackUnitats()">&larr; Torna a les unitats</button>
  <div class="cat-title" id="tema-cat-title"></div>
  <div class="cat-sub" id="tema-cat-sub"></div>
  <ul class="ex-list" id="temes-list"></ul>
</div>

<footer>

</footer>

<script src="publicats.js"></script>
<script>
/* ── DADES: unitats i temes ──────────────────────────────────────────
   L'`id` de la unitat és la seva carpeta ('u7') i l'`id` del tema és
   la subcarpeta i el nom del fitxer. Per tant, el tema 'bolzano' de la
   unitat 'u7' viu a  u7/bolzano/bolzano.html  i la seva clau dins de
   publicats.js és  'u7/bolzano'.  Tot es dedueix; no cal repetir rutes. */
const UNITATS = [
  {
    id: 'u7',
    nom: 'Unitat 7',
    subtitol: 'Límits i continuïtat',
    temes: [
      {
        id: 'practica',
        rang: 'exercicis 33–43',
        etiqueta: 'Practica',   // badge propi; sense num i sense titol
      },
      {
        id: 'limits-funcions',
        num: 1,
        titol: 'Interpreta i calcula el límit d\'una funció · Límits de funcions',
        rang: 'exercicis 44–65',
      },
      {
        id: 'limits-punt',
        num: 2,
        titol: 'Interpreta i calcula el límit d\'una funció · Límit d\'una funció en un punt',
        rang: 'exercicis 66–91',
      },
      {
        id: 'continuitat',
        num: 3,
        titol: 'Determina la continuïtat d\'una funció utilitzant límits',
        rang: 'exercicis 92–109',
      },
      {
        id: 'bolzano',
        num: 4,
        titol: 'Aplica i interpreta els teoremes de Bolzano i dels valors intermedis',
        rang: 'exercicis 110–115',
      },
      {
        id: 'problemes-limits',
        num: 5,
        titol: 'Utilitza el concepte de límit i la continuïtat d\'una funció per resoldre problemes',
        rang: 'exercicis 116–125',
      },
      {
        id: 'problemes-diversos',
        num: 6,
        titol: 'Problemes aparentment diferents',
        rang: 'exercicis 126–131',
      },
      {
        id: 'series',
        num: 7,
        titol: 'Matemàtiques en el món real · Sèries geomètriques infinites',
        rang: 'activitats 1–4',
      },
    ],
  },
  {
    id: 'u8',
    nom: 'Unitat 8',
    subtitol: 'Derivades',
    temes: [
      {
        id: 'practica',
        rang: 'exercicis 21–29',
        etiqueta: 'Practica',   // badge propi; sense num i sense titol
      },
      {
        id: 'derivada-punt',
        num: 1,
        titol: 'Calcula i interpreta la derivada d\'una funció · Taxa de variació mitjana',
        rang: 'exercicis 30–39',
      },
      {
        id: 'interpretacio-geometrica',
        num: 2,
        titol: 'Calcula i interpreta la derivada d\'una funció · Interpretació geomètrica de la derivada',
        rang: 'exercicis 40–66',
      },
      {
        id: 'derivabilitat',
        num: 3,
        titol: 'Estudia la derivabilitat d\'una funció',
        rang: 'exercicis 67–85',
      },
      {
        id: 'funcio-derivada',
        num: 4,
        titol: 'Calcula la derivada de qualsevol funció',
        rang: 'exercicis 86–124',
      },
      {
        id: 'problemes-contextualitzats',
        num: 5,
        titol: 'Aplica la funció derivada a la resolució de problemes contextualitzats',
        rang: 'exercicis 125–130',
      },
      {
        id: 'problemes-diferents',
        num: 6,
        titol: 'Problemes aparentment diferents',
        rang: 'exercicis 131–136',
      },
      {
        id: 'mon-real',
        num: 7,
        titol: 'Matemàtiques en el món real · Llei de Newton del refredament',
        rang: 'activitats 1–4',
      },
    ],
  },
  {
    id: 'u9',
    nom: 'Unitat 9',
    subtitol: 'Aplicacions de les derivades',
    temes: [
      {
        id: 'practica',
        rang: 'exercicis 30–38',
        etiqueta: 'Practica',   // badge propi; sense num i sense titol
      },
      {
        id: 'creixement',
        num: 1,
        titol: 'Aplica el càlcul de derivades a l\'estudi d\'una funció · Creixement i decreixement. Màxims i mínims',
        rang: 'exercicis 39–64',
      },
      {
        id: 'concavitat',
        num: 2,
        titol: 'Aplica el càlcul de derivades a l\'estudi d\'una funció · Concavitat i convexitat. Punts d\'inflexió',
        rang: 'exercicis 65–75',
      },
      {
        id: 'optimitzacio',
        num: 3,
        titol: 'Resol problemes d\'optimització mitjançant el càlcul de derivades',
        rang: 'exercicis 76–91',
      },
      {
        id: 'teoremes',
        num: 4,

        rang: 'exercicis 92–114',
      },
      {
        id: 'hopital',
        num: 5,
        titol: 'Aplica la regla de L\'Hôpital per resoldre indeterminacions en límits',
        rang: 'exercicis 115–128',
      },
      {
        id: 'aplicacions',
        num: 6,
        titol: 'Problemes amb aplicacions de les derivades',
        rang: 'exercicis 129–137',
      },
      {
        id: 'problemes-diferents',
        num: 7,
        titol: 'Problemes aparentment diferents',
        rang: 'exercicis 138–143',
      },
      {
        id: 'mon-real',
        num: 8,
        titol: 'Matemàtiques en el món real · La llauna perfecta',
        rang: 'activitats 1–4',
      },
    ],
  },
];

const clauDe   = (u,t) => u.id + '/' + t.id;
const fitxerDe = (u,t) => u.id + '/' + t.id + '/' + t.id + '.html';

/* Només els temes que el professor ha publicat a publicats.js */
function temesVisibles(u){
  return u.temes.filter(t => comptaPublicats(clauDe(u,t)) !== 0);
}

function renderUnitats(){
  const ul = document.getElementById('unitats-list');
  ul.innerHTML = '';
  const visibles = UNITATS.filter(u => temesVisibles(u).length > 0);

  document.getElementById('unitats-buit').style.display = visibles.length ? 'none' : 'block';

  visibles.forEach(u=>{
    const n = temesVisibles(u).length;
    const li = document.createElement('li');
    li.className = 'ex-item';
    li.innerHTML = `
      <span class="ex-badge">${u.nom}</span>
      <div class="ex-info">
        <div class="ex-title">${u.nom}</div>
        <div class="ex-sub">${u.subtitol} &middot; ${n===1 ? '1 tema' : n + ' temes'}</div>
      </div>
      <span class="ex-arrow">&rarr;</span>`;
    li.onclick = () => { location.hash = u.id; };
    ul.appendChild(li);
  });
}

function showUnitat(u){
  show('v-temes');
  document.getElementById('hd-title').textContent = u.nom + '. ' + u.subtitol;
  document.getElementById('tema-cat-title').textContent = u.nom;
  document.getElementById('tema-cat-sub').textContent = u.subtitol + ' · tria un tema';

  const ul = document.getElementById('temes-list');
  ul.innerHTML = '';
  temesVisibles(u).forEach(t=>{
    const etiqueta = t.etiqueta || ('Tema ' + t.num);
    const n = comptaPublicats(clauDe(u,t));
    const sub = (n === 'tots')
      ? t.rang
      : `${n} exercici${n===1?'':'s'} disponible${n===1?'':'s'}`;
    const li = document.createElement('li');
    li.className = 'ex-item';
    li.innerHTML = `
      <span class="ex-badge">${etiqueta}</span>
      <div class="ex-info">
        ${t.titol ? `<div class="ex-title">${t.titol}</div>` : ''}
        <div class="ex-sub">${sub}</div>
      </div>
      <span class="ex-arrow">&rarr;</span>`;
    li.onclick = () => { window.location.href = fitxerDe(u,t); };
    ul.appendChild(li);
  });
}

function mostraUnitats(){
  show('v-unitats');
  document.getElementById('hd-title').textContent = 'Exercicis propis';
}

function goBackUnitats(){ location.hash = ''; }

/* L'adreça mana: #u7 obre la llista de temes de la Unitat 7, i sense hash
   es veu la llista d'unitats. Així el botó "Torna als temes" d'una pàgina
   de tema pot enllaçar a ../../index.html#u7 i aterrar al lloc correcte,
   i el botó "enrere" del navegador també funciona. */
function router(){
  const id = location.hash.replace('#','');
  const u = UNITATS.find(x => x.id === id && temesVisibles(x).length > 0);
  if(u) showUnitat(u); else mostraUnitats();
}
window.addEventListener('hashchange', router);

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

renderUnitats();
router();
</script>
</body>
</html>
